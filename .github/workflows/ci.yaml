name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [room-updated]

permissions:
  contents: read

env:
  CAPNP_SKIP_CHECK: 1

jobs:
  build-rocky8:
    name: klayout + mroom (Rocky Linux 8)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: rockylinux:8

    steps:
      - name: Checkout KLayout-roomdb
        uses: actions/checkout@v4
        with:
          path: KLayout-roomdb

      - name: Checkout CommonDB
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/CommonDB
          path: CommonDB
          token: ${{ secrets.GH_PAT }}

      - name: Install dependencies
        run: bash KLayout-roomdb/scripts/ci-rocky8-deps.sh

      - name: Cache Cap'n Proto (Linux)
        uses: actions/cache@v4
        with:
          path: CommonDB/third_party/capnp-install-linux
          key: capnp-linux-rocky8-v1-${{ hashFiles('CommonDB/scripts/build_capnp_linux.sh') }}
          restore-keys: |
            capnp-linux-rocky8-v1-

      - name: Build KLayout + mroom
        run: |
          sed -i 's/\r$//' KLayout-roomdb/scripts/ci_build_klayout_mroom.sh
          bash KLayout-roomdb/scripts/ci_build_klayout_mroom.sh "$GITHUB_WORKSPACE"

      - name: Smoke test ROOM load (Python / pya)
        env:
          COMMONDB_ROOT: ${{ github.workspace }}/CommonDB
          KLAYOUT: ${{ github.workspace }}/KLayout-roomdb/klayout-src/bin-release/klayout
        run: |
          ROOM_PATH="$COMMONDB_ROOT/examples/gds_to_room/output/sample.room"
          if [[ ! -f "$ROOM_PATH" ]]; then
            echo "Skip smoke test: $ROOM_PATH not in CommonDB checkout"
            exit 0
          fi
          "$KLAYOUT" -b -r "${{ github.workspace }}/KLayout-roomdb/scripts/test_room_load.py"

      - name: Install linuxdeployqt
        run: bash KLayout-roomdb/scripts/ci_install_linuxdeployqt.sh

      - name: Package portable bundle
        env:
          # Must be github.workspace — env.GITHUB_WORKSPACE is empty in expressions
          # and silently dropped Cap'n Proto from the rocky8 artifact (libmroom unloadable).
          CAPNP_ROOT: ${{ github.workspace }}/CommonDB/third_party/capnp-install-linux
          BUNDLE_SKIP_LINUXDEPLOYQT: "1"
        run: |
          test -d "$CAPNP_ROOT/lib" || { echo "CAPNP_ROOT missing: $CAPNP_ROOT"; ls -la CommonDB/third_party || true; exit 1; }
          bash KLayout-roomdb/scripts/package_klayout_linux_bundle.sh \
            KLayout-roomdb/klayout-src/bin-release \
            KLayout-roomdb/klayout-rocky8-bundle.tar.gz \
            "Rocky Linux 8"

      - name: Upload Rocky 8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: klayout-rocky8
          path: KLayout-roomdb/klayout-rocky8-bundle.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-ubuntu24:
    name: klayout + mroom (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout KLayout-roomdb
        uses: actions/checkout@v4
        with:
          path: KLayout-roomdb

      - name: Checkout CommonDB
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/CommonDB
          path: CommonDB
          token: ${{ secrets.GH_PAT }}

      - name: Install dependencies
        run: sudo bash KLayout-roomdb/scripts/ci_ubuntu24_deps.sh

      - name: Cache Cap'n Proto (Linux)
        uses: actions/cache@v4
        with:
          path: CommonDB/third_party/capnp-install-linux
          key: capnp-linux-ubuntu24-v1-${{ hashFiles('CommonDB/scripts/build_capnp_linux.sh') }}
          restore-keys: |
            capnp-linux-ubuntu24-v1-

      - name: Build KLayout + mroom
        run: |
          sed -i 's/\r$//' KLayout-roomdb/scripts/ci_build_klayout_mroom.sh
          bash KLayout-roomdb/scripts/ci_build_klayout_mroom.sh "${{ github.workspace }}"

      - name: Smoke test ROOM load (Python / pya)
        env:
          COMMONDB_ROOT: ${{ github.workspace }}/CommonDB
          KLAYOUT: ${{ github.workspace }}/KLayout-roomdb/klayout-src/bin-release/klayout
        run: |
          ROOM_PATH="$COMMONDB_ROOT/examples/gds_to_room/output/sample.room"
          if [[ ! -f "$ROOM_PATH" ]]; then
            echo "Skip smoke test: $ROOM_PATH not in CommonDB checkout"
            exit 0
          fi
          "$KLAYOUT" -b -r "${{ github.workspace }}/KLayout-roomdb/scripts/test_room_load.py"

      - name: Install linuxdeployqt
        run: bash KLayout-roomdb/scripts/ci_install_linuxdeployqt.sh

      - name: Package Ubuntu 24 bundle
        env:
          CAPNP_ROOT: ${{ github.workspace }}/CommonDB/third_party/capnp-install-linux
          BUNDLE_SKIP_LINUXDEPLOYQT: "1"
        run: |
          bash KLayout-roomdb/scripts/package_klayout_linux_bundle.sh \
            KLayout-roomdb/klayout-src/bin-release \
            KLayout-roomdb/klayout-ubuntu24.tar.gz \
            "Ubuntu 24.04"

      - name: Upload Ubuntu 24 artifact
        uses: actions/upload-artifact@v4
        with:
          name: klayout-linux-ubuntu24
          path: KLayout-roomdb/klayout-ubuntu24.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Portable Windows zip (MSYS2 UCRT64 + deploy-win-mingw) for Door stack updater.
  build-windows:
    name: klayout + mroom (Windows portable)
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout KLayout-roomdb
        uses: actions/checkout@v4
        with:
          path: KLayout-roomdb
          submodules: recursive

      - name: Checkout ROOM
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/Room
          path: CommonDB
          token: ${{ secrets.GH_PAT }}

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git zip make
          pacboy: >-
            cmake:p ninja:p gcc:p make:p
            qt5-base:p qt5-tools:p qt5-svg:p qt5-multimedia:p
            qt5-xmlpatterns:p qt5-script:p
            python:p python-pip:p
            ruby:p
            zlib:p libgit2:p

      - name: Build Cap'n Proto (Windows)
        shell: cmd
        run: |
          set "COMMONDB_ROOT=%GITHUB_WORKSPACE%\CommonDB"
          call "%COMMONDB_ROOT%\scripts\build_capnp_windows.bat" https://github.com/capnproto/capnproto.git branch master "" "" "%COMMONDB_ROOT%\third_party\capnproto" "%COMMONDB_ROOT%\third_party\capnp-install"
          if not exist "%COMMONDB_ROOT%\third_party\capnp-install\include\capnp\message.h" (
            echo Cap'n Proto headers missing after Windows bootstrap
            exit /b 1
          )

      - name: Hook mroom + build/deploy portable (UCRT64)
        run: |
          set -euo pipefail
          WS="$(cygpath -u "$GITHUB_WORKSPACE")"
          export COMMONDB_ROOT="$WS/CommonDB"
          export CAPNP_ROOT="$COMMONDB_ROOT/third_party/capnp-install"
          # build.sh calls `make`; mingw package is mingw32-make — ensure both exist.
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          if ! command -v make >/dev/null 2>&1 && command -v mingw32-make >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            ln -sf "$(command -v mingw32-make)" "$HOME/bin/make"
            export PATH="$HOME/bin:$PATH"
          fi
          ROOT="$WS/KLayout-roomdb"
          KLAYOUT="$ROOT/klayout-src"
          sed -i 's/\r$//' "$ROOT/scripts/"*.sh "$KLAYOUT/build.sh" "$KLAYOUT/scripts/deploy-win-mingw.sh" || true
          bash "$ROOT/scripts/regenerate_klayout_capnp.sh"
          bash "$ROOT/scripts/setup_klayout_mroom.sh" "$KLAYOUT"
          test -f "$KLAYOUT/src/plugins/streamers/mroom/db_plugin/local.pri"
          # Builds into bin-release-win64-ucrt and copies Qt/MSYS runtime DLLs.
          (cd "$KLAYOUT" && bash scripts/deploy-win-mingw.sh -ucrt -qt5)
          TARGET="$(echo "$KLAYOUT"/bin-release-win64-ucrt*)"
          test -x "$TARGET/klayout.exe"
          {
            echo "flavor=windows"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source=klayout-windows"
          } > "$TARGET/BUNDLE_SOURCE.txt"
          mkdir -p "$ROOT/portable"
          (cd "$TARGET" && zip -r -q ../../portable/klayout-windows.zip .)
          ls -la "$ROOT/portable/klayout-windows.zip"

      - name: Upload Windows portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: klayout-windows
          path: KLayout-roomdb/portable/klayout-windows.zip
          if-no-files-found: error
          retention-days: 14
