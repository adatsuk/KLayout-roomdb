name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CAPNP_SKIP_CHECK: 1

jobs:
  build-rocky8:
    name: klayout + mroom (Rocky Linux 8)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: rockylinux:8

    steps:
      - name: Checkout KLayout-roomdb
        uses: actions/checkout@v4
        with:
          path: KLayout-roomdb

      - name: Checkout CommonDB
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/CommonDB
          path: CommonDB
          token: ${{ secrets.GH_PAT }}

      - name: Install dependencies
        run: bash KLayout-roomdb/scripts/ci-rocky8-deps.sh

      - name: Cache Cap'n Proto (Linux)
        uses: actions/cache@v4
        with:
          path: CommonDB/third_party/capnp-install-linux
          key: capnp-linux-rocky8-v1-${{ hashFiles('CommonDB/scripts/build_capnp_linux.sh') }}
          restore-keys: |
            capnp-linux-rocky8-v1-

      - name: Build KLayout + mroom
        run: |
          sed -i 's/\r$//' KLayout-roomdb/scripts/ci_build_klayout_mroom.sh
          bash KLayout-roomdb/scripts/ci_build_klayout_mroom.sh "$GITHUB_WORKSPACE"

      - name: Smoke test ROOM load
        env:
          COMMONDB_ROOT: ${{ env.GITHUB_WORKSPACE }}/CommonDB
          KLAYOUT: ${{ env.GITHUB_WORKSPACE }}/KLayout-roomdb/klayout-src/bin-release/klayout
        run: |
          ROOM_PATH="$COMMONDB_ROOT/examples/gds_to_room/output/sample.room"
          if [[ ! -f "$ROOM_PATH" ]]; then
            echo "Skip smoke test: $ROOM_PATH not in CommonDB checkout"
            exit 0
          fi
          "$KLAYOUT" -b -r "$GITHUB_WORKSPACE/KLayout-roomdb/scripts/test_room_load.rb"

      - name: Install linuxdeployqt
        run: bash KLayout-roomdb/scripts/ci_install_linuxdeployqt.sh

      - name: Package portable bundle
        env:
          CAPNP_ROOT: ${{ env.GITHUB_WORKSPACE }}/CommonDB/third_party/capnp-install-linux
          BUNDLE_SKIP_LINUXDEPLOYQT: "1"
        run: |
          bash KLayout-roomdb/scripts/package_klayout_linux_bundle.sh \
            KLayout-roomdb/klayout-src/bin-release \
            KLayout-roomdb/klayout-rocky8-bundle.tar.gz \
            "Rocky Linux 8"

      - name: Upload Rocky 8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: klayout-rocky8
          path: KLayout-roomdb/klayout-rocky8-bundle.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-ubuntu24:
    name: klayout + mroom (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout KLayout-roomdb
        uses: actions/checkout@v4
        with:
          path: KLayout-roomdb

      - name: Checkout CommonDB
        uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/CommonDB
          path: CommonDB
          token: ${{ secrets.GH_PAT }}

      - name: Install dependencies
        run: sudo bash KLayout-roomdb/scripts/ci_ubuntu24_deps.sh

      - name: Cache Cap'n Proto (Linux)
        uses: actions/cache@v4
        with:
          path: CommonDB/third_party/capnp-install-linux
          key: capnp-linux-ubuntu24-v1-${{ hashFiles('CommonDB/scripts/build_capnp_linux.sh') }}
          restore-keys: |
            capnp-linux-ubuntu24-v1-

      - name: Build KLayout + mroom
        run: |
          sed -i 's/\r$//' KLayout-roomdb/scripts/ci_build_klayout_mroom.sh
          bash KLayout-roomdb/scripts/ci_build_klayout_mroom.sh "${{ github.workspace }}"

      - name: Smoke test ROOM load
        env:
          COMMONDB_ROOT: ${{ github.workspace }}/CommonDB
          KLAYOUT: ${{ github.workspace }}/KLayout-roomdb/klayout-src/bin-release/klayout
        run: |
          ROOM_PATH="$COMMONDB_ROOT/examples/gds_to_room/output/sample.room"
          if [[ ! -f "$ROOM_PATH" ]]; then
            echo "Skip smoke test: $ROOM_PATH not in CommonDB checkout"
            exit 0
          fi
          "$KLAYOUT" -b -r "${{ github.workspace }}/KLayout-roomdb/scripts/test_room_load.rb"

      - name: Install linuxdeployqt
        run: bash KLayout-roomdb/scripts/ci_install_linuxdeployqt.sh

      - name: Package Ubuntu 24 bundle
        env:
          CAPNP_ROOT: ${{ github.workspace }}/CommonDB/third_party/capnp-install-linux
          BUNDLE_SKIP_LINUXDEPLOYQT: "1"
        run: |
          bash KLayout-roomdb/scripts/package_klayout_linux_bundle.sh \
            KLayout-roomdb/klayout-src/bin-release \
            KLayout-roomdb/klayout-ubuntu24.tar.gz \
            "Ubuntu 24.04"

      - name: Upload Ubuntu 24 artifact
        uses: actions/upload-artifact@v4
        with:
          name: klayout-linux-ubuntu24
          path: KLayout-roomdb/klayout-ubuntu24.tar.gz
          if-no-files-found: error
          retention-days: 14
